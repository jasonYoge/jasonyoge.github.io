name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "booksmarky/**"
      - "assets/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-books-marky-com
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PAGES_PROJECT_NAME: books-marky.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Cloudflare secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - name: Prepare site
        run: |
          mkdir -p dist
          cp booksmarky/index.html booksmarky/terms.html dist/
          cp -r assets dist/
          sed -i 's|\.\./assets/|assets/|g' dist/index.html dist/terms.html
          echo "Prepared files:"
          find dist -type f | sort

      - name: Install Wrangler
        run: npm install -g wrangler@4

      - name: Verify Cloudflare authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler whoami
          wrangler pages project list

      - name: Ensure Cloudflare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if wrangler pages project list --json | jq -e --arg name "$PAGES_PROJECT_NAME" 'map(select(.name == $name)) | length > 0' > /dev/null; then
            echo "Project $PAGES_PROJECT_NAME already exists"
          else
            echo "Creating Pages project $PAGES_PROJECT_NAME..."
            wrangler pages project create "$PAGES_PROJECT_NAME" --production-branch=main
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler pages deploy dist \
            --project-name="$PAGES_PROJECT_NAME" \
            --branch=main \
            --commit-dirty=true
