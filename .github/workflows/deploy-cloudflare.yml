name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "booksmarky/**"
      - "assets/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-books-marky
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: https://books-marky.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p dist
          cp booksmarky/index.html booksmarky/terms.html dist/
          cp -r assets dist/
          sed -i 's|\.\./assets/|assets/|g' dist/index.html dist/terms.html

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=books-marky --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Print deployment URL
        if: steps.deploy.outputs.deployment-url != ''
        run: echo "Deployed to ${{ steps.deploy.outputs.deployment-url }}"
